[package]
name = "yiyan-glasslate"
version = "0.1.0"
description = "一眼 Glasslate — 悬浮截图翻译（M0 验证实验室）"
authors = ["lizim"]
edition = "2021"

[lib]
name = "yiyan_glasslate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
