<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>一眼 Glasslate</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="glass-body">
    <div id="shell" class="glass">
      <header class="bar" data-tauri-drag-region>
        <span class="dot"></span>
        <span class="title">一眼 Glasslate</span>
        <nav class="tools" id="tools">
          <button id="btn-retranslate" class="icon-btn" title="重译（Alt+W）" aria-label="重译">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M21 12a9 9 0 1 1-3-6.7" />
              <path d="M21 3v6h-6" />
            </svg>
          </button>
          <button id="btn-copy" class="icon-btn" title="复制译文" aria-label="复制">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <rect x="9" y="9" width="12" height="12" rx="2" />
              <path d="M5 15V5a2 2 0 0 1 2-2h10" />
            </svg>
          </button>
          <button id="btn-settings" class="icon-btn" title="设置" aria-label="设置">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <circle cx="12" cy="12" r="3" />
              <path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1" />
            </svg>
          </button>
          <button id="btn-close" class="icon-btn" title="关闭（Alt+R）" aria-label="关闭">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M6 6l12 12M18 6 6 18" />
            </svg>
          </button>
        </nav>
      </header>

      <main id="content" class="content">
        <div class="empty" id="empty">
          <p class="empty-title">Alt + Q 框选一段文字</p>
          <p class="empty-hint">译文会盖在原文位置。现在翻译还没接上，先给你看 OCR 认出来的原文。</p>
          <button class="ghost" id="btn-new">先框一张试试</button>
        </div>

        <section class="result" id="result" hidden>
          <div class="result-head">
            <span id="meta" class="meta"></span>
            <button class="ghost tiny" id="btn-toggle-raw">原文</button>
          </div>
          <div class="lines" id="lines"></div>
          <pre class="raw" id="raw" hidden></pre>
        </section>

        <section class="error" id="error" hidden>
          <p class="error-title">没认出文字</p>
          <p class="error-body" id="error-body"></p>
          <button class="ghost" id="btn-retry">再框一次</button>
        </section>
      </main>

      <footer class="foot">
        <span id="status" class="status">就绪</span>
        <span id="engine" class="engine"></span>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
